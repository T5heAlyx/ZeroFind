<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    </pattern>
    <pattern id="circles" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2" fill="rgba(255,255,255,0.1)"/>
      <circle cx="30" cy="30" r="1.5" fill="rgba(255,255,255,0.1)"/>
      <circle cx="45" cy="15" r="1" fill="rgba(255,255,255,0.1)"/>
      <circle cx="20" cy="40" r="2.5" fill="rgba(255,255,255,0.1)"/>
    </pattern>
    <pattern id="shields" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 10 L40 15 40 35 30 40 20 35 20 15z" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.7"/>
      <path d="M10 35 L15 38 15 48 10 50 5 48 5 38z" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
      <path d="M45 42 L50 45 50 55 45 58 40 55 40 45z" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.6"/>
    </pattern>
  </defs>
  
  <!-- Arka plan desenleri -->
  <rect width="100" height="100" fill="url(#grid)"/>
  <rect width="100" height="100" fill="url(#circles)"/>
  <rect width="100" height="100" fill="url(#shields)"/>
  
  <!-- Küçük kalkan simgeleri -->
  <g opacity="0.15">
    <path d="M20 20 L30 25 30 45 20 50 10 45 10 25z" fill="none" stroke="#ffffff" stroke-width="1"/>
    <path d="M70 40 L80 45 80 65 70 70 60 65 60 45z" fill="none" stroke="#ffffff" stroke-width="1"/>
    <path d="M40 60 L50 65 50 85 40 90 30 85 30 65z" fill="none" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Network diyagramı -->
  <g opacity="0.2">
    <circle cx="25" cy="30" r="3" fill="#ffffff"/>
    <circle cx="60" cy="25" r="3" fill="#ffffff"/>
    <circle cx="75" cy="70" r="3" fill="#ffffff"/>
    <circle cx="35" cy="75" r="3" fill="#ffffff"/>
    <circle cx="50" cy="50" r="4" fill="#ffffff"/>
    
    <line x1="25" y1="30" x2="50" y2="50" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="60" y1="25" x2="50" y2="50" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="75" y1="70" x2="50" y2="50" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="35" y1="75" x2="50" y2="50" stroke="#ffffff" stroke-width="0.5"/>
  </g>
</svg>
